name: Test helmfile exit-code output capture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-populate tool cache with fake helmfile and helm
        run: |
          set -e
          TOOL_CACHE="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"

          # Fake helmfile v0.150.0
          HF_DIR="$TOOL_CACHE/helmfile/0.150.0/x64"
          mkdir -p "$HF_DIR"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-helmfile.sh" "$HF_DIR/helmfile"
          chmod +x "$HF_DIR/helmfile"
          touch "$TOOL_CACHE/helmfile/0.150.0/x64.complete"

          # Fake helm v3.11.0
          HELM_DIR="$TOOL_CACHE/helm/3.11.0/x64"
          mkdir -p "$HELM_DIR"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-helm.sh" "$HELM_DIR/helm"
          chmod +x "$HELM_DIR/helm"
          touch "$TOOL_CACHE/helm/3.11.0/x64.complete"

          echo "Tool cache populated"
      # Run helmfile with an invalid subcommand to get a non-zero exit code
      # and verify the exit-code output is properly captured via the finally block
      - id: action
        uses: .
        continue-on-error: true
        with:
          helmfile-args: 'invalid-subcommand-that-does-not-exist'
          helmfile-version: 'v0.150.0'
          helm-version: 'v3.11.0'
          helm-plugins: ''
      - name: Assert exit-code output is set and non-zero
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          # exit-code should be set (in finally block, always runs)
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output should be set even when action fails"
            exit 1
          fi
          # exit-code should be non-zero for an invalid subcommand
          if [ "$EXIT_CODE" = "0" ]; then
            echo "FAIL: expected non-zero exit-code but got 0"
            exit 1
          fi
          echo "PASS: exit-code '$EXIT_CODE' is non-zero as expected"
          # The action step should have failed (setFailed called for exit code != 0 and != 2)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action outcome to be 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: outcome was '$OUTCOME', exit-code output correctly captured"
