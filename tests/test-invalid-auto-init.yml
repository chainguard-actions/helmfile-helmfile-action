name: Test invalid helmfile-auto-init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          helmfile-args: version
          helmfile-version: v0.169.1
          helmfile-auto-init: 'maybe'
          helm-plugins: ''
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          STDOUT: ${{ steps.action.outputs.helmfile-stdout }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid helmfile-auto-init"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: helmfile should not have run (exit-code should be 0)"
            exit 1
          fi
          if [ -n "$STDOUT" ]; then
            echo "FAIL: helmfile stdout should be empty"
            exit 1
          fi
          echo "PASS"
