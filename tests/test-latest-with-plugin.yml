name: Test latest versions with default helm-diff plugin
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          helmfile-args: version
      - name: Assert outputs and plugin
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          STDOUT: ${{ steps.action.outputs.helmfile-stdout }}
        run: |
          echo "exit-code: $EXIT_CODE"
          echo "stdout: $STDOUT"
          [ "$EXIT_CODE" = "0" ] || { echo "FAIL: expected exit-code 0"; exit 1; }
          [ -n "$STDOUT" ] || { echo "FAIL: empty stdout"; exit 1; }
          helm plugin list | tee /tmp/plugins
          grep -qi "diff" /tmp/plugins || { echo "FAIL: helm-diff plugin not installed"; exit 1; }
          echo "PASS"
