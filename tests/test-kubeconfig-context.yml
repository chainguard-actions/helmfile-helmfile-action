name: Test helmfile-kubeconfig-context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure ~/.kube exists (action's mkdir does not expand ~)
        run: |
          mkdir -p "$HOME/.kube"
          rm -f "$HOME/.kube/config"
      - id: action
        uses: .
        with:
          helmfile-args: version
          helmfile-version: v0.169.1
          helm-version: v3.16.2
          helm-plugins: ''
          helmfile-kubeconfig-context: |
            apiVersion: v1
            kind: Config
            current-context: test-ctx-marker
            clusters: []
            contexts: []
            users: []
      - name: Assert kubeconfig written
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ] || { echo "FAIL: expected exit-code 0"; exit 1; }
          if [ ! -f "$HOME/.kube/config" ]; then
            echo "FAIL: $HOME/.kube/config not found"
            exit 1
          fi
          cat "$HOME/.kube/config"
          if ! grep -q "test-ctx-marker" "$HOME/.kube/config"; then
            echo "FAIL: kubeconfig content missing marker"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup stray literal ~ directory
        if: always()
        run: rm -rf "./~" || true
