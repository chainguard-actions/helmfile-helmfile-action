name: Test helmfile command failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          helmfile-args: --file does-not-exist.yaml template
          helmfile-version: v0.169.1
          helm-version: v3.16.2
          helm-plugins: ''
      - name: Assert failure and non-zero exit code
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          STDERR: ${{ steps.action.outputs.helmfile-stderr }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "stderr: $STDERR"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step failure"
            exit 1
          fi
          if [ -z "$EXIT_CODE" ] || [ "$EXIT_CODE" = "0" ] || [ "$EXIT_CODE" = "2" ]; then
            echo "FAIL: expected a non-zero, non-2 exit code"
            exit 1
          fi
          echo "PASS"
